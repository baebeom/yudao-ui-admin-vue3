<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title>农知管理系统</title> -->
     <title>知识点问答小知识库</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f7fa;
        z-index: 9999;
      }
      .loading-content {
        text-align: center;
      }
      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
      }
      .title {
        color: #303133;
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 30px;
      }
      /* 简单圆圈加载动画 */
      .circle-spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto;
        border: 3px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="loading-content">
          <div class="circle-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
